<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker>
  </defs>
  <rect width="950" height="300" fill="#ffffff"/>
  <!-- code -->
  <rect x="20" y="40" width="170" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="70" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Code (*.tf)</text>
  <text x="105" y="94" text-anchor="middle" fill="#334155">état VOULU</text>
  <text x="105" y="116" text-anchor="middle" fill="#64748b" font-size="13">versionné dans Git</text>
  <!-- plan -->
  <rect x="270" y="40" width="250" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="395" y="70" text-anchor="middle" font-weight="bold" fill="#713f12">tofu plan</text>
  <text x="395" y="94" text-anchor="middle" fill="#334155">compare voulu / connu / réel</text>
  <text x="395" y="116" text-anchor="middle" fill="#64748b" font-size="13">+ créer  ~ modifier  - détruire</text>
  <!-- apply -->
  <rect x="600" y="40" width="150" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="70" text-anchor="middle" font-weight="bold" fill="#14532d">tofu apply</text>
  <text x="675" y="94" text-anchor="middle" fill="#334155">appels d'API</text>
  <text x="675" y="116" text-anchor="middle" fill="#64748b" font-size="13">via le provider</text>
  <!-- real -->
  <rect x="790" y="40" width="145" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="862" y="70" text-anchor="middle" font-weight="bold" fill="#0f172a">Infra réelle</text>
  <text x="862" y="94" text-anchor="middle" fill="#334155">Docker, AWS...</text>
  <text x="862" y="116" text-anchor="middle" fill="#64748b" font-size="13">état RÉEL</text>
  <!-- state -->
  <rect x="410" y="200" width="260" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="228" text-anchor="middle" font-weight="bold" fill="#7f1d1d">State (.tfstate)</text>
  <text x="540" y="250" text-anchor="middle" fill="#334155">état CONNU : code ↔ objets</text>
  <text x="540" y="270" text-anchor="middle" fill="#64748b" font-size="13">jamais dans Git (secrets)</text>
  <!-- arrows -->
  <line x1="190" y1="85" x2="266" y2="85" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="228" y="76" text-anchor="middle" fill="#1e3a8a" font-size="13">init</text>
  <line x1="520" y1="85" x2="596" y2="85" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
  <text x="558" y="76" text-anchor="middle" fill="#1e3a8a" font-size="13">relu</text>
  <line x1="750" y1="85" x2="786" y2="85" stroke="#1e3a8a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="675" y1="130" x2="600" y2="196" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="170" fill="#14532d" font-size="13">met à jour</text>
  <line x1="480" y1="198" x2="410" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="175" fill="#7f1d1d" font-size="13">lu par le plan</text>
  <path d="M862,130 C862,250 770,262 674,250" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="760" y="235" fill="#475569" font-size="13">refresh</text>
  <text x="790" y="290" fill="#b91c1c" font-size="13">dérive = réel ≠ code</text>
</svg>
