name: Preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  preview:
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Annoncer la PR
        run: echo "Prévisualisation de la PR -- ${{ github.event.pull_request.title }}"

      - uses: some-user/deploy-preview-action@main
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Construire et lancer
        run: |
          npm install
          npm run build
          docker compose up -d

      - name: Déboguer
        run: echo "token=${{ secrets.DEPLOY_TOKEN }}" && env
