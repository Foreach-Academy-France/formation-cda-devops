<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Value stream map : corriger un bug de TaskFlow</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="330" fill="#ffffff"/>

  <!-- Client -->
  <rect x="10" y="60" width="110" height="70" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="65" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">Utilisateur</text>
  <text x="65" y="112" text-anchor="middle" font-size="14" fill="#0c4a6e">signale le bug</text>

  <!-- Attente 1 -->
  <line x1="120" y1="95" x2="190" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>
  <polygon points="215,70 240,115 190,115" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="215" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">!</text>
  <text x="215" y="140" text-anchor="middle" font-size="14" fill="#92400e">ticket en file</text>
  <line x1="240" y1="95" x2="290" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Étape 1 : développement -->
  <rect x="290" y="55" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Développement</text>
  <text x="365" y="108" text-anchor="middle" font-size="14" fill="#1e3a8a">+ test, PR</text>
  <text x="365" y="126" text-anchor="middle" font-size="13" fill="#1e3a8a">%C/A 90 %</text>

  <!-- Attente 2 -->
  <line x1="440" y1="95" x2="490" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>
  <polygon points="515,70 540,115 490,115" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="515" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">!</text>
  <text x="515" y="140" text-anchor="middle" font-size="14" fill="#92400e">PR en attente</text>
  <line x1="540" y1="95" x2="590" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Étape 2 : revue -->
  <rect x="590" y="55" width="130" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Revue</text>
  <text x="655" y="112" text-anchor="middle" font-size="14" fill="#1e3a8a">+ merge</text>

  <!-- Attente 3 -->
  <line x1="720" y1="95" x2="770" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>
  <polygon points="795,70 820,115 770,115" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="795" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">!</text>
  <text x="795" y="135" text-anchor="middle" font-size="14" fill="#92400e">fenêtre de</text>
  <text x="795" y="152" text-anchor="middle" font-size="14" fill="#92400e">mise en prod</text>
  <line x1="820" y1="95" x2="870" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Étape 3 : déploiement -->
  <rect x="870" y="55" width="140" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="940" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Déploiement</text>
  <text x="940" y="112" text-anchor="middle" font-size="14" fill="#1e3a8a">manuel</text>
  <line x1="1010" y1="95" x2="1085" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Ligne de temps -->
  <text x="10" y="205" font-size="14" font-weight="bold" fill="#92400e">Attente</text>
  <text x="10" y="270" font-size="14" font-weight="bold" fill="#1e3a8a">Traitement</text>
  <polyline points="120,215 290,215 290,260 440,260 440,215 590,215 590,260 720,260 720,215 870,215 870,260 1010,260"
            fill="none" stroke="#334155" stroke-width="2"/>
  <text x="215" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">2 j (14 h)</text>
  <text x="365" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">3 h</text>
  <text x="515" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">1 j (7 h)</text>
  <text x="655" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">30 min</text>
  <text x="795" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">5 j (35 h)</text>
  <text x="940" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">30 min</text>

  <text x="550" y="320" text-anchor="middle" font-size="15" fill="#334155">1 jour ouvré = 7 h · attente 56 h · traitement 4 h · lead time 60 h · efficacité ≈ 6,7 %</text>
</svg>
