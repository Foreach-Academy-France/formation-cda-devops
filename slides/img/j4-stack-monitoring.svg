<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
  <rect width="1000" height="330" fill="#ffffff"/>
  <!-- prod network -->
  <rect x="15" y="15" width="380" height="300" rx="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="30" y="38" fill="#475569" font-weight="bold">réseau Docker « taskflow-prod » (projet taskflow-prod)</text>
  <rect x="35" y="60" width="110" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="90" y="90" text-anchor="middle">proxy :443</text>
  <rect x="175" y="60" width="90" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="220" y="90" text-anchor="middle">front :80</text>
  <rect x="175" y="160" width="90" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="182" text-anchor="middle">api :3000</text>
  <text x="220" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">/metrics</text>
  <rect x="175" y="250" width="90" height="45" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="220" y="277" text-anchor="middle">db</text>
  <line x1="145" y1="85" x2="171" y2="85" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="110" x2="220" y2="156" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="210" x2="220" y2="246" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="28" y="140" fill="#64748b" font-size="11">/metrics n'est PAS</text>
  <text x="28" y="155" fill="#64748b" font-size="11">routé par les Nginx :</text>
  <text x="28" y="170" fill="#64748b" font-size="11">invisible depuis</text>
  <text x="28" y="185" fill="#64748b" font-size="11">l'extérieur</text>
  <!-- monitoring -->
  <rect x="430" y="15" width="555" height="300" rx="12" fill="#fffbeb" stroke="#d97706" stroke-dasharray="6 4"/>
  <text x="445" y="38" fill="#92400e" font-weight="bold">projet « taskflow-monitoring » (raccordé au réseau taskflow-prod)</text>
  <rect x="450" y="60" width="180" height="50" rx="8" fill="#fde68a" stroke="#d97706"/>
  <text x="540" y="82" text-anchor="middle">blackbox</text>
  <text x="540" y="100" text-anchor="middle" font-size="12">sonde http://front/health</text>
  <rect x="470" y="160" width="140" height="60" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="540" y="184" text-anchor="middle" font-weight="bold">Prometheus</text>
  <text x="540" y="204" text-anchor="middle" font-size="12">:9090 · règles</text>
  <rect x="690" y="160" width="130" height="60" rx="8" fill="#fecaca" stroke="#dc2626"/>
  <text x="755" y="184" text-anchor="middle" font-weight="bold">Alertmanager</text>
  <text x="755" y="204" text-anchor="middle" font-size="12">:9093</text>
  <rect x="860" y="160" width="110" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="915" y="184" text-anchor="middle">Mailpit</text>
  <text x="915" y="204" text-anchor="middle" font-size="12">:8025</text>
  <rect x="450" y="250" width="180" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="540" y="272" text-anchor="middle" font-weight="bold">Grafana</text>
  <text x="540" y="290" text-anchor="middle" font-size="12">:3001 · dashboards en code</text>
  <!-- arrows -->
  <line x1="450" y1="85" x2="269" y2="85" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="78" fill="#92400e" font-size="12">GET /health</text>
  <line x1="540" y1="160" x2="540" y2="114" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="140" fill="#9a3412" font-size="12">scrape /probe</text>
  <line x1="470" y1="190" x2="269" y2="185" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="232" fill="#9a3412" font-size="12">scrape /metrics</text>
  <text x="280" y="248" fill="#9a3412" font-size="12">toutes les 15 s</text>
  <text x="280" y="264" fill="#9a3412" font-size="12">(PULL)</text>
  <line x1="610" y1="190" x2="686" y2="190" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="618" y="182" fill="#991b1b" font-size="12">alertes</text>
  <line x1="820" y1="190" x2="856" y2="190" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="250" x2="540" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="548" y="242" fill="#14532d" font-size="12">PromQL</text>
</svg>
