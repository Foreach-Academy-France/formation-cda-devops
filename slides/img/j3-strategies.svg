<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1100" height="400" fill="#ffffff"/>
  <g>
    <rect x="10" y="10" width="260" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="140" y="40" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e3a8a">Recreate</text>
    <rect x="40" y="70" width="200" height="40" rx="6" fill="#93c5fd"/><text x="140" y="96" text-anchor="middle">v1 ×3</text>
    <text x="140" y="140" text-anchor="middle" fill="#b91c1c">arrêt : coupure</text>
    <rect x="40" y="160" width="200" height="40" rx="6" fill="#86efac"/><text x="140" y="186" text-anchor="middle">v2 ×3</text>
    <text x="140" y="250" text-anchor="middle" font-size="13">+ simple, une seule version</text>
    <text x="140" y="272" text-anchor="middle" font-size="13">− indisponibilité</text>
    <text x="140" y="294" text-anchor="middle" font-size="13">TaskFlow : docker compose up -d</text>
  </g>
  <g>
    <rect x="285" y="10" width="260" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="415" y="40" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e3a8a">Rolling</text>
    <rect x="315" y="70" width="60" height="30" rx="5" fill="#86efac"/><rect x="385" y="70" width="60" height="30" rx="5" fill="#93c5fd"/><rect x="455" y="70" width="60" height="30" rx="5" fill="#93c5fd"/>
    <rect x="315" y="110" width="60" height="30" rx="5" fill="#86efac"/><rect x="385" y="110" width="60" height="30" rx="5" fill="#86efac"/><rect x="455" y="110" width="60" height="30" rx="5" fill="#93c5fd"/>
    <rect x="315" y="150" width="60" height="30" rx="5" fill="#86efac"/><rect x="385" y="150" width="60" height="30" rx="5" fill="#86efac"/><rect x="455" y="150" width="60" height="30" rx="5" fill="#86efac"/>
    <text x="415" y="250" text-anchor="middle" font-size="13">+ pas de coupure, peu de ressources</text>
    <text x="415" y="272" text-anchor="middle" font-size="13">− v1 et v2 coexistent</text>
    <text x="415" y="294" text-anchor="middle" font-size="13">Kubernetes par défaut</text>
  </g>
  <g>
    <rect x="560" y="10" width="260" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="690" y="40" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e3a8a">Blue/green</text>
    <rect x="650" y="65" width="80" height="34" rx="6" fill="#fde68a"/><text x="690" y="87" text-anchor="middle">routeur</text>
    <rect x="585" y="150" width="100" height="40" rx="6" fill="#93c5fd"/><text x="635" y="176" text-anchor="middle">blue v1</text>
    <rect x="700" y="150" width="100" height="40" rx="6" fill="#86efac"/><text x="750" y="176" text-anchor="middle">green v2</text>
    <line x1="690" y1="99" x2="750" y2="148" stroke="#16a34a" stroke-width="3"/>
    <line x1="690" y1="99" x2="635" y2="148" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="690" y="250" text-anchor="middle" font-size="13">+ bascule et retour instantanés</text>
    <text x="690" y="272" text-anchor="middle" font-size="13">− 2× les ressources</text>
    <text x="690" y="294" text-anchor="middle" font-size="13">− base partagée : expand/contract</text>
  </g>
  <g>
    <rect x="835" y="10" width="255" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="962" y="40" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e3a8a">Canary</text>
    <rect x="922" y="65" width="80" height="34" rx="6" fill="#fde68a"/><text x="962" y="87" text-anchor="middle">routeur</text>
    <rect x="855" y="150" width="120" height="40" rx="6" fill="#93c5fd"/><text x="915" y="176" text-anchor="middle">v1 : 95 %</text>
    <rect x="990" y="150" width="85" height="40" rx="6" fill="#86efac"/><text x="1032" y="176" text-anchor="middle">v2 : 5 %</text>
    <line x1="962" y1="99" x2="915" y2="148" stroke="#2563eb" stroke-width="5"/>
    <line x1="962" y1="99" x2="1032" y2="148" stroke="#16a34a" stroke-width="2"/>
    <text x="962" y="250" text-anchor="middle" font-size="13">+ rayon d'impact limité</text>
    <text x="962" y="272" text-anchor="middle" font-size="13">− exige des métriques</text>
    <text x="962" y="294" text-anchor="middle" font-size="13">et un routage fin</text>
  </g>
</svg>
